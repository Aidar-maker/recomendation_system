<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжный Советник - Вход</title>
    <script>
        (function() {
            const saved = localStorage.getItem('siteTheme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>

    <div class="card auth-card shadow-lg">
        <div class="card-header text-center bg-white border-0 pt-4 pb-2">
            <h2 class="mb-0">Книжный Советник</h2>
            <p class="text-muted mb-0">Добро пожаловать!</p>
        </div>
        
        <div class="card-body p-4">
            
            <!-- Место для сообщений об ошибках (используется в auth.js) -->
            <div id="alertContainer"></div>

            <!-- Табы: Вход / Регистрация -->
            <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Вход</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Регистрация</button>
                </li>
            </ul>

            <!-- Содержимое табов -->
            <div class="tab-content" id="authTabsContent">
                
                <!-- Форма ВХОДА -->
                <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                </div>

                <!-- Форма регистрации -->
                <div class="tab-pane fade" id="register-pane" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regUsername" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="regUsername" placeholder="Ivan" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Скрипты (Порядок важен!) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script> 

</body>
</html>
