<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжный Советник - Чтение</title>
    <script>
        (function() {
            const saved = localStorage.getItem('siteTheme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        .reader-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .chapter-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 2px 8px var(--shadow-color);
            font-size: 1.1rem;
        }
        
        .chapter-content h1, .chapter-content h2, .chapter-content h3 {
            color: var(--text-color);
            margin-top: 1.5em;
        }
        
        .chapter-content p {
            margin-bottom: 1em;
            text-align: justify;
        }
        
        .reader-header {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        
        .progress-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            color: var(--text-color);
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .progress {
            height: 8px;
            border-radius: 4px;
        }
        
        .nav-btn {
            min-width: 120px;
        }
        
        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .font-small { font-size: 0.9rem !important; }
        .font-medium { font-size: 1.1rem !important; }
        .font-large { font-size: 1.3rem !important; }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <header class="reader-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a href="catalog.html" class="btn btn-outline-secondary btn-sm">← Каталог</a>
                
                <div class="d-flex align-items-center gap-3">
                    <!-- Настройки шрифта -->
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-secondary" onclick="setFontSize('small')">A-</button>
                        <button class="btn btn-outline-secondary" onclick="setFontSize('medium')">A</button>
                        <button class="btn btn-outline-secondary" onclick="setFontSize('large')">A+</button>
                    </div>
                    
                    <!-- Переключатель тем -->
                    <button class="btn btn-outline-secondary btn-sm" id="themeToggle" onclick="cycleTheme()" title="Сменить тему">
                        🎨 Тема
                    </button>
                </div>
                
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">📚 Библиотека</a>
            </div>
            
            <!-- Заголовок главы -->
            <div class="mt-3">
                <h5 class="mb-1" id="bookTitle">Загрузка...</h5>
                <h4 class="mb-0" id="chapterTitle">Глава...</h4>
            </div>
        </div>
    </header>

    <!-- Контент главы -->
    <main class="reader-container">
        <article id="chapterContent" class="chapter-content">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                <p class="mt-3 text-muted">Загружаем главу...</p>
            </div>
        </article>
        
        <!-- Навигация между главами -->
        <div class="d-flex justify-content-between mt-4">
            <button id="prevBtn" class="btn btn-primary nav-btn" disabled>← Назад</button>
            <button id="nextBtn" class="btn btn-primary nav-btn" disabled>Вперёд →</button>
        </div>
    </main>

    <!-- Индикатор прогресса -->
    <div class="progress-bar-container">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="text-muted">Прогресс чтения</small>
            <small id="progressPercent" class="text-muted">0%</small>
        </div>
        <div class="progress">
            <div id="progressFill" class="progress-bar bg-primary" role="progressbar" style="width: 0%"></div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-check.js"></script> 
    <script src="js/reader.js"></script>

</body>
</html>
