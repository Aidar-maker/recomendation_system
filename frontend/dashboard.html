<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжный Советник - Личный кабинет</title>
    <!-- Подключение Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .nav-link.active { font-weight: bold; }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Книжный Советник</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3" id="user-email">Загрузка...</span>
                <button class="btn btn-outline-light btn-sm" id="logout-btn">Выйти</button>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container">
        
        <!-- Вкладки (Tabs) -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="rec-tab" data-bs-toggle="tab" data-bs-target="#rec-pane" type="button" role="tab">🔥 Рекомендации</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="fav-tab" data-bs-toggle="tab" data-bs-target="#fav-pane" type="button" role="tab">❤️ Избранное</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="read-tab" data-bs-toggle="tab" data-bs-target="#read-pane" type="button" role="tab">📖 Мои книги</button>
            </li>
        </ul>

        <!-- Содержимое вкладок -->
        <div class="tab-content" id="myTabContent">
            
            <!-- 1. Рекомендации -->
            <div class="tab-pane fade show active" id="rec-pane" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Персональные рекомендации</h4>
                    <button class="btn btn-primary btn-sm" id="refresh-rec">🔄 Обновить</button>
                </div>
                <div class="row" id="recommendations-list">
                    <!-- Сюда app.js вставит книги -->
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>

            <!-- 2. Избранное -->
            <div class="tab-pane fade" id="fav-pane" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Ваша коллекция</h4>
                    <button class="btn btn-outline-primary btn-sm" id="refresh-fav">🔄 Обновить</button>
                </div>
                <div class="row" id="favorites-list">
                    <!-- Сюда app.js вставит книги -->
                </div>
            </div>

            <!-- 3. Чтение -->
            <div class="tab-pane fade" id="read-pane" role="tabpanel">
                <h4 class="mb-3">Статусы чтения</h4>
                <div class="row" id="reading-list">
                    <!-- Сюда app.js вставит книги -->
                </div>
            </div>

        </div>
    </div>

    <!-- Подключение JS файлов -->
    <!-- Порядок важен: сначала API, потом Auth, потом App -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
