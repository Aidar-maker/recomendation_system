<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книжный Советник - Личный кабинет</title>

    <script>
        (function() {
            const saved = localStorage.getItem('siteTheme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    
    <!-- Подключение Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .nav-link.active { font-weight: bold; }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Книжный Советник</a>
            <div class="d-flex">
                <a href="catalog.html" class="btn btn-outline-light me-2">📖 Каталог</a>
                <a href="admin.html" class="btn btn-outline-warning me-2 admin-only">⚙️ Админка</a>
                <a href="request_moderation.html" class="btn btn-outline-info me-2">📝 Подать запрос</a>
                <a href="submit_content.html" class="btn btn-outline-info me-2">📝 Подать заявку</a>

                <span class="navbar-text text-white me-3" id="user-email">Загрузка...</span>
                <button class="btn btn-outline-light btn-sm" id="logout-btn">Выйти</button>
            </div>
        </div>
    </nav>

    <!-- Блок "Продолжить чтение" -->
    <div class="container mb-4" id="continueReadingBlock" style="display: none;">
        <div class="alert alert-primary d-flex align-items-center" role="alert">
            <div class="flex-grow-1">
                <h5 class="mb-1">📖 Продолжить чтение</h5>
                <p class="mb-1" id="continueBookTitle">Загрузка...</p>
                <small class="text-muted" id="continueChapterInfo">Глава...</small>
            </div>
            <button id="continueReadingBtn" class="btn btn-primary ms-3">
                Продолжить →
            </button>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <!-- Вкладки (Tabs) -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="rec-tab" data-bs-toggle="tab" data-bs-target="#rec-pane" type="button" role="tab">🔥 Рекомендации</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="fav-tab" data-bs-toggle="tab" data-bs-target="#fav-pane" type="button" role="tab">❤️ Избранное</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="read-tab" data-bs-toggle="tab" data-bs-target="#read-pane" type="button" role="tab">📖 Мои книги</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats-pane" type="button" role="tab">📊 Статистика</button>
            </li>
        </ul>

        <!-- Содержимое вкладок -->
        <div class="tab-content" id="myTabContent">
            
            <!-- 1. Рекомендации -->
            <div class="tab-pane fade show active" id="rec-pane" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Персональные рекомендации</h4>
                    <button class="btn btn-primary btn-sm" id="refresh-rec">🔄 Обновить</button>
                </div>
                <div class="row" id="recommendations-list">
                    <!-- Сюда app.js вставит книги -->
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>

            <!-- 2. Избранное -->
            <div class="tab-pane fade" id="fav-pane" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Ваша коллекция</h4>
                    <button class="btn btn-outline-primary btn-sm" id="refresh-fav">🔄 Обновить</button>
                </div>
                <div class="row" id="favorites-list">
                    <!-- Сюда app.js вставит книги -->
                </div>
            </div>

            <!-- 3. Чтение -->
            <div class="tab-pane fade" id="read-pane" role="tabpanel">
                <h4 class="mb-3">Статусы чтения</h4>
                <div class="row" id="reading-list">
                    <!-- Сюда app.js вставит книги -->
                </div>
            </div>

            <!-- 4. Статистика -->
            <div class="tab-pane fade" id="stats-pane" role="tabpanel">
                <h4 class="mb-4">📊 Ваша статистика чтения</h4>
                
                <div class="row g-4" id="statsContainer">
                    <!-- Сюда app.js вставит карточки -->
                    <div class="col-12 text-center">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение JS файлов -->
    <!-- Порядок важен: сначала API, потом Auth, потом App -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/user.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
